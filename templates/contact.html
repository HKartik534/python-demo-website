<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact | ChronoLux</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/style.css') }}">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        Chrono<span>Lux</span>
    </div>

    <div class="nav-links">

        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('products') }}">Watches</a>
        <a href="{{ url_for('cart') }}">🛒 Cart</a>

    </div>

</nav>


<section class="contact-page">

    <div class="section-heading">

        <p>GET IN TOUCH</p>

        <h1>Contact Us</h1>

    </div>


    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="success">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST"
          class="contact-form">

        <input
            type="text"
            name="name"
            placeholder="Your Name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Your Email"
            required
        >

        <textarea
            name="message"
            placeholder="Your Message"
            rows="6"
            required
        ></textarea>

        <button
            type="submit"
            class="btn">

            Send Message

        </button>

    </form>

</section>


</body>
</html>
